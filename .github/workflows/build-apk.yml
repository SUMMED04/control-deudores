name: APK de Deudores

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      # El wrapper no se versiona (gradle-wrapper.jar es un binario), asi que
      # se genera aqui con la version de Gradle que pide el plugin de Android.
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar el wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Renombrar el APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SummedDeudores.apk

      # Se publica en un release de tag fijo y se sobrescribe en cada build:
      # la cuota de artefactos de la cuenta esta llena, y asi el enlace de
      # descarga es siempre el mismo.
      - name: Publicar en el release fijo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ultima-version --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create ultima-version \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "Última versión" \
                 --notes "APK de la app de deudores, se sobrescribe en cada compilación de main."
          gh release upload ultima-version SummedDeudores.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
